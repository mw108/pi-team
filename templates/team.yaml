# Project-local Pi Team template. Set real provider/model IDs before /team.
# Review discovered commands before approving them.
workflow:
  maxFullCycles: 3
  maxLocalFixCycles: 5
  maxPentestCycles: 2
  maxAgentFailures: 2
  maxQuestions: 5
  agentTimeoutMs: 600000 # total agent execution budget; role timeoutMs overrides
  maxToolCalls: 80
qualityGates:
  codeReview:
    enabled: true
  pentest:
    enabled: false
  testing:
    enabled: true
  commit:
    enabled: true
tester:
  mayModifyTests: false
  testPaths:
    - tests/
    - test/
integrations:
  serena:
    enabled: true
  context7:
    enabled: true
  web:
    enabled: true
pentest:
  localUrls: []
  localHttp:
    allowedOrigins: []
    allowedMethods:
      - GET
    timeoutMs: 10000
    maxRequestBodyBytes: 1048576
    maxResponseBodyBytes: 2097152
commit:
  runHooks: false
ui:
  progress:
    enabled: true
    refreshMs: 2000
    showToolActivity: true
    showModels: false
    showToolProvider: false
logging:
  agentLogs:
    level: summary # off or summary; no tool arguments or results
toolActivity:
  mappings: {} # e.g. "custom_search_*": { category: web-search, provider: Custom }
commands: []
agents:
  orchestrator:
    role: orchestrator
    prompt: agents/orchestrator.md
    provider: local
    model: configure-model-id
    thinking: off
    timeoutMs: 300000
  researcher:
    role: researcher
    prompt: agents/researcher.md
    provider: local
    model: configure-model-id
    thinking: off
    timeoutMs: 900000
  solver1:
    role: solver
    prompt: agents/solver-architecture.md
    provider: local
    model: configure-model-id
    thinking: off
    timeoutMs: 600000
  solver2:
    role: solver
    prompt: agents/solver-pragmatic.md
    provider: local
    model: configure-model-id
    thinking: off
    timeoutMs: 600000
  solver3:
    role: solver
    prompt: agents/solver-alternative.md
    provider: local
    model: configure-model-id
    thinking: off
    timeoutMs: 600000
  critic:
    role: critic
    prompt: agents/critic.md
    provider: local
    model: configure-model-id
    thinking: off
  reviewer:
    role: reviewer
    prompt: agents/reviewer.md
    provider: local
    model: configure-model-id
    thinking: off
  implementor:
    role: implementor
    prompt: agents/implementor.md
    provider: local
    model: configure-model-id
    thinking: off
    timeoutMs: 1200000
  codeReviewer:
    role: code-reviewer
    prompt: agents/code-reviewer.md
    provider: local
    model: configure-model-id
    thinking: off
    timeoutMs: 900000
  pentester:
    role: pentester
    prompt: agents/pentester.md
    provider: local
    model: configure-model-id
    thinking: off
    timeoutMs: 1200000
  securityReviewer:
    role: security-reviewer
    prompt: agents/security-reviewer.md
    provider: local
    model: configure-model-id
    thinking: off
  tester:
    role: tester
    prompt: agents/tester.md
    provider: local
    model: configure-model-id
    thinking: off
  commitAgent:
    role: commit-agent
    prompt: agents/commit-agent.md
    provider: local
    model: configure-model-id
    thinking: off
    timeoutMs: 300000
